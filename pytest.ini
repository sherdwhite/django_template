[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = core.settings

# Python path configuration (. for base directory, booklist for Django apps and settings)
pythonpath = . booklist

# Directories to search for tests
testpaths = booklist tests

# Test file naming conventions
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*

# Pytest-asyncio mode
asyncio_mode = auto

# Additional CLI options
addopts =
    --strict-markers
    --tb=short
    -ra

